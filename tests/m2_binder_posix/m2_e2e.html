<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WasmAndroid M2 POSIX verification</title>
<h1>WasmAndroid M2 POSIX verification</h1>
<pre id="result">Running…</pre>
<script type="module">
  import { runM2 } from './m2_worker.mjs';

  let result;
  try {
    if (!crossOriginIsolated) throw new Error('The E2E needs cross-origin isolation for SharedArrayBuffer');
    const wasm = new URL('/build/m2_posix.wasm', location.href);
    const module = await WebAssembly.compileStreaming(fetch(wasm));
    result = await runM2(module);
    const streams = performance.getEntriesByName(wasm.href, 'resource').length;
    if (streams !== 1) throw new Error(`Expected one Wasm fetch, got ${streams}`);
    result.wasm_streams = streams;
  } catch (error) {
    result = { ok: false, error: error.stack || String(error) };
  }
  globalThis.__waM2Result = result;
  document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
</script>
</html>
